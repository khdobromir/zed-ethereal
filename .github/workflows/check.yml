name: Check theme

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: curl --fail --location --retry 3 --max-time 60 https://zed.dev/schema/themes/v0.2.0.json -o theme-schema.json
      - run: python scripts/check.py theme-schema.json
      - run: git diff --check
